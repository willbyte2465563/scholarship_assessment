services:
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # File-change events don't cross the Windows -> container bind mount, so poll instead.
      WATCHFILES_FORCE_POLLING: "true"
