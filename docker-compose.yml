services:
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      # Optional: without it the UI shows the recorded demo run; only scoring needs GEMINI_API_KEY.
      - path: .env
        required: false
    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      # File-change events don't cross the Windows -> container bind mount, so poll instead.
      WATCHFILES_FORCE_POLLING: "true"
